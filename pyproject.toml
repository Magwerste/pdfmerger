[project]
name = "pdfmerger"
version = "1.0.0"
description = "A command-line tool for merging PDF files with per-file page selection."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = ["pypdf>=4.0"]

[project.scripts]
pdfmerger = "pdfmerger.cli:main"

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
